<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Dashboard</p>
          <h1>Student Management System</h1>
        </div>
        <div class="header-actions">
          <span class="total-box">Total Students: <strong id="totalStudents">0</strong></span>
          <button id="addStudentButton" class="primary-btn">Add Student</button>
        </div>
      </header>

      <main class="layout">
        <section class="panel form-panel">
          <div class="section-header">
            <h2 id="formTitle">Add Student</h2>
            <button id="resetButton" class="secondary-btn" type="button">Reset</button>
          </div>

          <form id="studentForm">
            <div class="grid-two">
              <div class="field">
                <label for="first_name">First Name</label>
                <input id="first_name" name="first_name" type="text" required />
              </div>
              <div class="field">
                <label for="last_name">Last Name</label>
                <input id="last_name" name="last_name" type="text" required />
              </div>
            </div>

            <div class="grid-two">
              <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required />
              </div>
              <div class="field">
                <label for="phone_number">Phone Number</label>
                <input id="phone_number" name="phone_number" type="tel" required />
              </div>
            </div>

            <div class="grid-two">
              <div class="field">
                <label for="gender">Gender</label>
                <select id="gender" name="gender">
                  <option value="">Select</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="field">
                <label for="date_of_birth">Date of Birth</label>
                <input id="date_of_birth" name="date_of_birth" type="date" />
              </div>
            </div>

            <div class="grid-two">
              <div class="field">
                <label for="course">Course</label>
                <input id="course" name="course" type="text" required />
              </div>
              <div class="field">
                <label for="batch">Batch</label>
                <input id="batch" name="batch" type="text" required />
              </div>
            </div>

            <div class="field">
              <label for="address">Address</label>
              <textarea id="address" name="address" rows="3"></textarea>
            </div>

            <div class="button-row">
              <button type="submit" class="primary-btn">Submit</button>
              <button type="button" class="danger-btn" id="deleteSelectedButton" hidden>Delete Selected</button>
            </div>
          </form>
        </section>

        <section class="panel records-panel">
          <div class="section-header search-header">
            <h2>Student Records</h2>
            <div class="search-wrap">
              <input
                id="searchInput"
                type="text"
                placeholder="Search by name or email"
                aria-label="Search students"
              />
              <button id="clearSearchButton" class="secondary-btn" type="button">Clear</button>
            </div>
          </div>

          <div id="searchMessage" class="status-message" aria-live="polite"></div>
          <div id="tableLoading" class="table-loading" hidden>Loading records…</div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Course</th>
                  <th>Batch</th>
                  <th>Created</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="studentTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="/static/script.js"></script>
  </body>
</html>
